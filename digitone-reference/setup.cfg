[metadata]
name = digitone-reference
version = 0.1.0
description = Digitone SysEx capture and deterministic A/B reference workflow
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
package_dir =
    = python
python_requires = >=3.9

[options.packages.find]
where = python

[options.extras_require]
midi =
    mido>=1.2
    python-rtmidi>=1.1
audio =
    sounddevice>=0.4
hardware =
    mido>=1.2
    python-rtmidi>=1.1
    sounddevice>=0.4

[options.entry_points]
console_scripts =
    digitone-reference = digitone_ref.cli:main
