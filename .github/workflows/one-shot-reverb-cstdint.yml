name: Verify standalone reverb cstdint fix

on:
  push:
    branches:
      - automation/fix-reverb-cstdint
    paths:
      - .github/workflows/one-shot-reverb-cstdint.yml

permissions:
  contents: write

jobs:
  patch-verify-commit:
    if: github.event.head_commit.message == 'Verify standalone reverb cstdint fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Add cstdint without changing line endings
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path('wasm/reverb/kessho_reverb.cpp')
          data = path.read_bytes()
          pattern = br'(#include "kessho_reverb\.h")(\r?\n)'
          matches = list(re.finditer(pattern, data))
          if len(matches) != 1:
              raise SystemExit('expected exactly one reverb include insertion point')
          match = matches[0]
          replacement = match.group(1) + match.group(2) + b'#include <cstdint>' + match.group(2)
          path.write_bytes(data[:match.start()] + replacement + data[match.end():])
          PY
          numstat="$(git diff origin/main --numstat -- wasm/reverb/kessho_reverb.cpp)"
          printf 'reverb vs main numstat: %s\n' "$numstat"
          test "$numstat" = $'1\t0\twasm/reverb/kessho_reverb.cpp'

      - name: Verify Product FX suite
        run: npm run core:product:fx

      - name: Commit verified include fix
        run: |
          git config user.name "kessho-ci-fix"
          git config user.email "kessho-ci-fix@users.noreply.github.com"
          git rm .github/workflows/one-shot-reverb-cstdint.yml
          git add wasm/reverb/kessho_reverb.cpp
          staged="$(git diff origin/main --cached --numstat -- wasm/reverb/kessho_reverb.cpp)"
          printf 'staged reverb vs main numstat: %s\n' "$staged"
          test "$staged" = $'1\t0\twasm/reverb/kessho_reverb.cpp'
          git commit -m "Include cstdint in standalone reverb translation unit"
          git push origin HEAD:automation/fix-reverb-cstdint
