name: Promo Capture V3 Runner

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/promo-*'
      - 'cpp/KesshoCore/tests/PromoAudioRender.cpp'
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate Product Core bindings
        run: npm run core:product:generate
      - name: Render native Product Core promo audio
        run: node scripts/promo-product-core-native.mjs
      - name: Upload capture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kessho-promo-capture-v3
          path: promo-capture-v3-artifacts/
          if-no-files-found: error
          retention-days: 7
