name: Digitone reference

on:
  push:
    paths:
      - "digitone-reference/**"
      - ".github/workflows/digitone-reference-ci.yml"
  pull_request:
    paths:
      - "digitone-reference/**"
      - ".github/workflows/digitone-reference-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: digitone-reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and test C++ core
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Test protocol, workflow, and renderer boundary
        run: PYTHONPATH=python python -m unittest discover -s python/tests -v
