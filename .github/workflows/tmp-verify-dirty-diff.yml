name: Temporary dirty-diff verification

on:
  push:
    branches:
      - fix/dirty-diff-harness-soundscape
    paths:
      - .github/workflows/tmp-verify-dirty-diff.yml

permissions:
  contents: read

jobs:
  dirty-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run core:product:dirty-diff
