name: Product Core CI

on:
  pull_request:
    paths:
      - 'cpp/KesshoCore/**'
      - 'src/audio/coreProduct*'
      - 'src/audio/generated/**'
      - 'public/worklets/kessho-core-product.worklet.js'
      - 'public/worklets/kessho_core.wasm'
      - 'scripts/check-kessho-product*'
      - 'scripts/generate-kessho-product-bindings.mjs'
      - 'scripts/kessho-core-build-manifest.mjs'
      - 'KesshoNativeSwift/CoreBridge/**'
      - 'KesshoNativeSwift/Kessho/CoreBridge/**'
      - 'KesshoNativeSwift/KesshoProductNativeReleaseSmoke/**'
      - 'KesshoNativeSwift/Generated/**'
      - 'docs/kessho-product-core-migration-status.md'
      - 'docs/kessho-product-default-gate-v2.md'
      - 'docs/kessho-product-patch-bridge-policy.md'
      - 'docs/kessho-product-native-release-proof.md'
      - 'docs/kessho-product-asset-manifest-decode-matrix.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/product-core-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'cpp/KesshoCore/**'
      - 'src/audio/coreProduct*'
      - 'src/audio/generated/**'
      - 'public/worklets/kessho-core-product.worklet.js'
      - 'public/worklets/kessho_core.wasm'
      - 'scripts/check-kessho-product*'
      - 'scripts/generate-kessho-product-bindings.mjs'
      - 'scripts/kessho-core-build-manifest.mjs'
      - 'KesshoNativeSwift/CoreBridge/**'
      - 'KesshoNativeSwift/Kessho/CoreBridge/**'
      - 'KesshoNativeSwift/KesshoProductNativeReleaseSmoke/**'
      - 'KesshoNativeSwift/Generated/**'
      - 'docs/kessho-product-core-migration-status.md'
      - 'docs/kessho-product-default-gate-v2.md'
      - 'docs/kessho-product-patch-bridge-policy.md'
      - 'docs/kessho-product-native-release-proof.md'
      - 'docs/kessho-product-asset-manifest-decode-matrix.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/product-core-ci.yml'

jobs:
  product-core:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
      - run: npm run core:build:wasm
      - run: npm run core:product:workflow
      - run: npm run core:product:ci
      - run: npm run core:product:default-gate-v2
      - run: npm run core:readiness:browser
      - run: swift build --package-path KesshoNativeSwift
