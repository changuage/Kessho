name: Product Core CI

on:
  pull_request:
    paths:
      - 'cpp/KesshoCore/**'
      - 'src/audio/CoreProduct*'
      - 'src/audio/coreProduct*'
      - 'src/audio/generated/**'
      - 'src/App.tsx'
      - 'public/worklets/kessho-core-product.worklet.js'
      - 'public/worklets/kessho_core.wasm'
      - 'public/samples/**'
      - 'scripts/check-kessho-product*'
      - 'scripts/check-kessho-core-parity-readiness.mjs'
      - 'scripts/check-web-core-sonic-parity.mjs'
      - 'scripts/profile-kessho-core-acceptance-corpus.mjs'
      - 'scripts/build-kessho-core-wasm.mjs'
      - 'scripts/generate-kessho-product-bindings.mjs'
      - 'scripts/run-kessho-product-ci.mjs'
      - 'scripts/kessho-core-build-manifest.mjs'
      - 'KesshoNativeSwift/CoreBridge/**'
      - 'KesshoNativeSwift/Kessho/CoreBridge/**'
      - 'KesshoNativeSwift/KesshoProductNativeReleaseSmoke/**'
      - 'KesshoNativeSwift/Generated/**'
      - 'docs/kessho-product-core-migration-status.md'
      - 'docs/kessho-product-default-gate-v2.md'
      - 'docs/kessho-product-patch-bridge-policy.md'
      - 'docs/kessho-product-native-release-proof.md'
      - 'docs/kessho-product-asset-manifest-decode-matrix.md'
      - 'docs/reports/kessho-core-acceptance-corpus.*'
      - 'docs/reports/kessho-core-parity-readiness-latest.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/product-core-ci.yml'
  push:
    paths:
      - 'cpp/KesshoCore/**'
      - 'src/audio/CoreProduct*'
      - 'src/audio/coreProduct*'
      - 'src/audio/generated/**'
      - 'src/App.tsx'
      - 'public/worklets/kessho-core-product.worklet.js'
      - 'public/worklets/kessho_core.wasm'
      - 'public/samples/**'
      - 'scripts/check-kessho-product*'
      - 'scripts/check-kessho-core-parity-readiness.mjs'
      - 'scripts/check-web-core-sonic-parity.mjs'
      - 'scripts/profile-kessho-core-acceptance-corpus.mjs'
      - 'scripts/build-kessho-core-wasm.mjs'
      - 'scripts/generate-kessho-product-bindings.mjs'
      - 'scripts/run-kessho-product-ci.mjs'
      - 'scripts/kessho-core-build-manifest.mjs'
      - 'KesshoNativeSwift/CoreBridge/**'
      - 'KesshoNativeSwift/Kessho/CoreBridge/**'
      - 'KesshoNativeSwift/KesshoProductNativeReleaseSmoke/**'
      - 'KesshoNativeSwift/Generated/**'
      - 'docs/kessho-product-core-migration-status.md'
      - 'docs/kessho-product-default-gate-v2.md'
      - 'docs/kessho-product-patch-bridge-policy.md'
      - 'docs/kessho-product-native-release-proof.md'
      - 'docs/kessho-product-asset-manifest-decode-matrix.md'
      - 'docs/reports/kessho-core-acceptance-corpus.*'
      - 'docs/reports/kessho-core-parity-readiness-latest.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/product-core-ci.yml'

jobs:
  product-core:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: brew install emscripten
      - run: npm run type-check
      - run: npm run build
      - run: npm run core:build:wasm
      - run: npm run core:product:workflow
      - run: npm run core:product:ci
      - run: npm run core:product:default-gate-v2
      - name: Run browser readiness
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/kessho-vite-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill ${preview_pid}' EXIT
          node -e 'const url=process.argv[1]; const deadline=Date.now()+30000; (async function wait(){ while (Date.now()<deadline) { try { const response=await fetch(url); if (response.ok) return; } catch {} await new Promise((resolve)=>setTimeout(resolve,500)); } console.error("Timed out waiting for " + url); process.exit(1); })();' http://127.0.0.1:4173/
          npm run core:readiness:browser -- --url=http://127.0.0.1:4173/
      - run: swift build --package-path KesshoNativeSwift
