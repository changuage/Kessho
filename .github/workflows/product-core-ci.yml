name: Product Core CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cpp/KesshoCore/**'
      - 'src/audio/CoreProduct*'
      - 'src/audio/coreProduct*'
      - 'src/audio/product/**'
      - 'src/audio/generated/**'
      - 'src/App.tsx'
      - 'src/main.tsx'
      - 'src/audio/sonicParityHarness.ts'
      - 'src/audio/referenceAudioRuntime.ts'
      - 'src/presets/factoryPresets.ts'
      - 'src/presets/currentPresetSchema.ts'
      - 'src/presets/currentPresetSchemaRegression.test.ts'
      - 'src/ui/reverb/**'
      - 'src/ui/keyboard/**'
      - 'src/ui/useMorphPositionRuntimeSurface.ts'
      - 'public/worklets/kessho-core-product.worklet.js'
      - 'public/worklets/kessho_core.wasm'
      - 'public/samples/**'
      - 'wasm/pad/**'
      - 'wasm/drum/**'
      - 'scripts/check-kessho-product*'
      - 'scripts/param-accounting/**'
      - 'docs/reports/kessho-product-level-calibration-contract.json'
      - 'docs/reports/kessho-product-sample-asset-loudness-latest.json'
      - 'scripts/check-pad-synth-dsp.mjs'
      - 'scripts/check-web-core-sonic-parity.mjs'
      - 'scripts/run-kessho-product-sequencer-evolve-regression.mjs'
      - 'scripts/build-kessho-core-wasm.mjs'
      - 'scripts/generate-kessho-product-bindings.mjs'
      - 'scripts/run-kessho-product-ci.mjs'
      - 'vite.config.ts'
      - 'scripts/kessho-core-build-manifest.mjs'
      - 'docs/kessho-product-core-migration-status.md'
      - 'docs/kessho-product-default-gate-v3.md'
      - 'docs/kessho-product-patch-bridge-policy.md'
      - 'docs/kessho-product-asset-manifest-decode-matrix.md'
      - 'docs/kessho-product-web-audio-graph-parity*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/product-core-ci.yml'
  push:
    paths:
      - 'cpp/KesshoCore/**'
      - 'src/audio/CoreProduct*'
      - 'src/audio/coreProduct*'
      - 'src/audio/product/**'
      - 'src/audio/generated/**'
      - 'src/App.tsx'
      - 'src/main.tsx'
      - 'src/audio/sonicParityHarness.ts'
      - 'src/audio/referenceAudioRuntime.ts'
      - 'src/presets/factoryPresets.ts'
      - 'src/presets/currentPresetSchema.ts'
      - 'src/presets/currentPresetSchemaRegression.test.ts'
      - 'src/ui/reverb/**'
      - 'src/ui/keyboard/**'
      - 'src/ui/useMorphPositionRuntimeSurface.ts'
      - 'public/worklets/kessho-core-product.worklet.js'
      - 'public/worklets/kessho_core.wasm'
      - 'public/samples/**'
      - 'wasm/pad/**'
      - 'wasm/drum/**'
      - 'scripts/check-kessho-product*'
      - 'scripts/param-accounting/**'
      - 'docs/reports/kessho-product-level-calibration-contract.json'
      - 'docs/reports/kessho-product-sample-asset-loudness-latest.json'
      - 'scripts/check-web-core-sonic-parity.mjs'
      - 'scripts/check-pad-synth-dsp.mjs'
      - 'scripts/run-kessho-product-sequencer-evolve-regression.mjs'
      - 'scripts/build-kessho-core-wasm.mjs'
      - 'scripts/generate-kessho-product-bindings.mjs'
      - 'scripts/run-kessho-product-ci.mjs'
      - 'vite.config.ts'
      - 'scripts/kessho-core-build-manifest.mjs'
      - 'docs/kessho-product-core-migration-status.md'
      - 'docs/kessho-product-default-gate-v3.md'
      - 'docs/kessho-product-patch-bridge-policy.md'
      - 'docs/kessho-product-asset-manifest-decode-matrix.md'
      - 'docs/kessho-product-web-audio-graph-parity*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/product-core-ci.yml'

jobs:
  product-core:
    runs-on: macos-14
    env:
      # The page CPU gate must compare against the PR base (or the previous
      # pushed commit), never whichever commit happens to be HEAD^ in a
      # shallow/merge checkout.
      KESSHO_PRODUCT_PAGE_CPU_BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      KESSHO_PRODUCT_PAGE_CPU_PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      KESSHO_PRODUCT_PAGE_CPU_PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: brew install emscripten
      - run: npm run core:product:ci:prereqs
      - run: npm run core:product:default-gate-v3

      - name: Upload Product CPU gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-core-cpu-gate-reports
          if-no-files-found: warn
          path: |
            docs/reports/kessho-product-page-cpu-before-after-latest.json
            docs/reports/kessho-product-page-cpu-before-after-latest.md
            docs/reports/kessho-product-page-cpu-comparison-latest.json
            docs/reports/kessho-product-page-cpu-comparison-latest.md
            docs/reports/kessho-product-ci-latest.json
            docs/reports/kessho-product-default-gate-v3-latest.json
            docs/reports/kessho-product-default-gate-v3-latest.md
            docs/reports/kessho-product-web-graph-capture-smoke-fast-latest.json
            docs/reports/kessho-product-web-graph-capture-smoke-latest.json

      - name: Upload Product level calibration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-core-level-calibration-reports
          if-no-files-found: warn
          path: |
            docs/reports/kessho-product-level-calibration-latest.json
            docs/reports/kessho-product-level-calibration-latest.md
            docs/reports/kessho-product-sample-asset-loudness-latest.json

      - name: Surface Product CPU gate summary
        if: always()
        shell: bash
        run: |
          for report in \
            docs/reports/kessho-product-page-cpu-before-after-latest.md \
            docs/reports/kessho-product-page-cpu-comparison-latest.md \
            docs/reports/kessho-product-default-gate-v3-latest.md; do
            if [ -f "$report" ]; then
              {
                echo "## $report"
                cat "$report"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
