name: WASM CI

env:
  EMSDK_VERSION: 5.0.2

on:
  pull_request:
    paths:
      - 'wasm/**'
      - '.github/workflows/wasm-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'wasm/**'
      - '.github/workflows/wasm-ci.yml'

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}

      - name: Install Emscripten SDK
        shell: bash
        run: |
          if [ ! -d emsdk ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git emsdk
          fi
          ./emsdk/emsdk install "$EMSDK_VERSION"
          ./emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Activate Emscripten SDK
        shell: bash
        run: |
          source ./emsdk/emsdk_env.sh
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          echo "EM_CONFIG=$EM_CONFIG" >> "$GITHUB_ENV"
          echo "$EMSDK" >> "$GITHUB_PATH"
          echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
          echo "$EMSDK/upstream/bin" >> "$GITHUB_PATH"
          find "$EMSDK/node" -maxdepth 2 -type d -name bin -print -quit >> "$GITHUB_PATH"

      - name: Verify Emscripten
        run: emcc --version

      - name: Build drum WASM
        run: bash wasm/drum/build.sh

      - name: Build lead-fm WASM
        run: bash wasm/lead-fm/build.sh

      - name: Build pad WASM
        run: bash wasm/pad/build.sh

      - name: Build reverb WASM
        run: bash wasm/reverb/build.sh

      - name: Build granular-fx WASM
        run: bash wasm/granular-fx/build.sh

      - name: Build soundscapes WASM
        run: bash wasm/soundscapes/build.sh

      - name: Build spectral-freeze WASM
        run: bash wasm/spectral-freeze/build.sh

      - name: Report sizes
        run: |
          echo "=== WASM binary sizes ==="
          for d in drum lead-fm pad reverb granular-fx soundscapes spectral-freeze; do
            f="wasm/$d/kessho_*.wasm"
            for wf in $f; do
              if [ -f "$wf" ]; then
                SIZE=$(wc -c < "$wf")
                echo "  $(basename $wf): $(( SIZE / 1024 )) KB"
              fi
            done
          done
