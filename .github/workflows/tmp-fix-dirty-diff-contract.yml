name: Temporary dirty-diff contract fix

on:
  push:
    branches:
      - fix/dirty-diff-soundscape-contract
    paths:
      - .github/workflows/tmp-fix-dirty-diff-contract.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Align soundscape dirty-diff regression with runtime contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/check-kessho-product-dirty-diff-classification.mjs')
          source = path.read_text()
          old = """    const soundscapeParamNext = clone(base);\n    soundscapeParamNext.soundscape.moduleParams[1] = 0.72;\n    const soundscapeParamDiff = adapterHarness.buildCoreProductSnapshotDiff(base, soundscapeParamNext);\n    assert(soundscapeParamDiff.applied === false && soundscapeParamDiff.reason === 'soundscape-param-change', 'soundscape structured param changes must full-reload with classified reason');\n"""
          new = """    const soundscapeParamNext = clone(base);\n    soundscapeParamNext.soundscape.moduleParams[1] = 0.72;\n    const soundscapeParamDiff = adapterHarness.buildCoreProductSnapshotDiff(base, soundscapeParamNext);\n    assert(soundscapeParamDiff.applied === true, 'compatible soundscape module param changes must dirty-diff');\n    assert(\n      soundscapeParamDiff.events.some((event) =>\n        event.type === 'param' &&\n          event.paramId === 'SourceLevel' &&\n          event.targetId === adapterHarness.context.CORE_PRODUCT_SOUNDSCAPE_MODULE_PARAM_TARGET_BASE + 1 &&\n          Math.abs(event.value - 0.72) < 1.0e-6),\n      'soundscape module param dirty diff did not emit the targeted runtime param event',\n    );\n\n    const soundscapeShapeNext = clone(base);\n    soundscapeShapeNext.soundscape.moduleParamCount = 1;\n    const soundscapeShapeDiff = adapterHarness.buildCoreProductSnapshotDiff(base, soundscapeShapeNext);\n    assert(\n      soundscapeShapeDiff.applied === false && soundscapeShapeDiff.reason === 'soundscape-param-change',\n      'soundscape structured shape changes must full-reload with classified reason',\n    );\n"""
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected one stale soundscape assertion block, found {count}')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Verify dirty-diff command
        run: npm run core:product:dirty-diff
      - name: Remove temporary workflow and commit verified fix
        shell: bash
        run: |
          git rm .github/workflows/tmp-fix-dirty-diff-contract.yml
          git config user.name 'Kessho CI Fix'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/check-kessho-product-dirty-diff-classification.mjs
          git commit -m 'Align soundscape dirty-diff regression contract'
          git push origin HEAD:fix/dirty-diff-soundscape-contract
