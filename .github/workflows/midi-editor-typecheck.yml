name: MIDI Editor Typecheck

on:
  push:
    branches:
      - feat/lpd8-wireless-midi-editor

permissions:
  contents: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply remaining LPD8 strict-type fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/ui/midi/controllers/Lpd8WirelessSetupDialog.tsx')
          text = path.read_text()
          old = "return assignment?.ccNumber === latestMessage.data1 && assignment.channel === latestMessage.channel;"
          new = "return assignment?.ccNumber === latestMessage.data1 && assignment?.channel === latestMessage.channel;"
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/ui/midi/controllers/Lpd8WirelessSetupDialog.tsx
            git commit -m "fix: guard optional LPD8 assignment"
            git push
          fi
      - run: npx tsc --noEmit
