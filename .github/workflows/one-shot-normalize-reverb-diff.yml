name: Normalize standalone reverb include diff

on:
  push:
    branches:
      - automation/fix-fx-routing-fixture
    paths:
      - .github/workflows/one-shot-normalize-reverb-diff.yml

permissions:
  contents: write

jobs:
  normalize-verify-commit:
    if: github.event.head_commit.message == 'Verify normalized reverb diff against main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore exact reverb blob and add only cstdint
        run: |
          git show origin/main:wasm/reverb/kessho_reverb.cpp > /tmp/kessho_reverb.cpp
          cp /tmp/kessho_reverb.cpp wasm/reverb/kessho_reverb.cpp
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path('wasm/reverb/kessho_reverb.cpp')
          data = path.read_bytes()
          pattern = br'(#include "kessho_reverb\.h")(\r?\n)'
          match = re.search(pattern, data)
          if match is None:
              raise SystemExit('reverb include insertion point not found')
          if len(re.findall(pattern, data)) != 1:
              raise SystemExit('expected exactly one reverb include insertion point')
          replacement = match.group(1) + match.group(2) + b'#include <cstdint>' + match.group(2)
          path.write_bytes(data[:match.start()] + replacement + data[match.end():])
          PY
          numstat="$(git diff origin/main --numstat -- wasm/reverb/kessho_reverb.cpp)"
          printf 'reverb vs main numstat: %s\n' "$numstat"
          test "$numstat" = $'1\t0\twasm/reverb/kessho_reverb.cpp'

      - name: Verify Product FX suite
        run: npm run core:product:fx

      - name: Commit normalized verified diff
        run: |
          git config user.name "kessho-ci-fix"
          git config user.email "kessho-ci-fix@users.noreply.github.com"
          git rm .github/workflows/one-shot-normalize-reverb-diff.yml
          git add wasm/reverb/kessho_reverb.cpp
          git diff --cached --check
          git commit -m "Keep reverb include fix line-ending neutral"
          git push origin HEAD:automation/fix-fx-routing-fixture
