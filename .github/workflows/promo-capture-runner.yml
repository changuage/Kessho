name: Promo Capture Runner

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/promo-capture.mjs'
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture production Kessho web app
        run: node scripts/promo-capture.mjs

      - name: Upload capture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kessho-promo-capture
          path: promo-capture-artifacts/
          if-no-files-found: warn
          retention-days: 7
