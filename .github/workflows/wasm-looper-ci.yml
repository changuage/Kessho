name: WASM Looper CI

on:
  pull_request:
    paths:
      - 'wasm/looper-fx/**'
      - 'wasm/soundscapes/**'
      - '.github/workflows/wasm-looper-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'wasm/looper-fx/**'
      - 'wasm/soundscapes/**'
      - '.github/workflows/wasm-looper-ci.yml'

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:5.0.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build looper WASM
        run: |
          bash wasm/looper-fx/build.sh
          echo "Looper WASM compiled successfully"

      - name: Build soundscapes WASM
        run: |
          if [ -f wasm/soundscapes/build.sh ]; then
            bash wasm/soundscapes/build.sh
            echo "Soundscapes WASM compiled successfully"
          else
            echo "Soundscapes build.sh not found, skipping"
          fi

      - name: Report sizes
        run: |
          echo "=== WASM binary sizes ==="
          for f in wasm/looper-fx/*.wasm wasm/soundscapes/*.wasm; do
            if [ -f "$f" ]; then
              SIZE=$(wc -c < "$f")
              echo "  $(basename $f): $(( SIZE / 1024 )) KB"
            fi
          done
