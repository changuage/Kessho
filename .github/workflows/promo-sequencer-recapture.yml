name: Promo Sequencer Recapture

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/promo-*'
  workflow_dispatch:

jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Install capture browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Capture authentic playing sequencers
        run: |
          sed -i '' 's/headless: true/headless: false/g' scripts/promo-sequencer-recapture.mjs
          node scripts/promo-run-visualonly.mjs
      - name: Upload capture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kessho-sequencer-recapture
          path: promo-sequencer-recapture-artifacts/
          if-no-files-found: error
          retention-days: 7
