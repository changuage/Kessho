name: FX Alt Build Temp

on:
  push:
    branches:
      - ux/fx-hero-alt-pages

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vite build
      - run: npm run architecture:web-tsx-reachability
