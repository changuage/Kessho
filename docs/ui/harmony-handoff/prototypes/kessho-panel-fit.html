<section id="k-fit" aria-label="Kessho Harmony and sequencer layout study">
<header class="mast"><strong>結晶 <span>Kessho</span></strong><nav aria-label="Workspace"><button data-page="Global">Global</button><button data-page="Synth">Synth</button></nav></header>
<div class="panes" data-workspace="Global">
<aside><article><header>Presets <small>L4</small></header><div class="inside"><div class="row"><span>A · String Waves</span><span>B · Evening Air</span></div><div id="blend"></div><button id="journey">Start Journey</button></div></article></aside>
<article class="work"><header>Harmony <small id="status" aria-live="polite">Engine</small></header><div class="instrument">
<div class="dial" role="img" aria-label="Circle of fifths, current tonal center and route"><div class="track"></div><div class="hub"><small id="keylabel"></small><b id="chord"></b></div></div>
<div class="brain"><div class="row"><strong>Brain</strong><small>In scale</small></div><div class="pads"></div><button id="back">Return to Engine</button></div></div>
<div class="strip"><small>Progression</small><span id="progression"></span></div></article></div>
<div class="panes" data-workspace="Synth" hidden><aside><article><header>∿ Synth</header><div class="strip">Pad Synth <small>On</small></div><div class="strip">Lead Synth <small>On</small></div></article></aside>
<article class="work"><header>Synth sequencer <button data-page="Global" id="link"></button></header><div class="inside"><div class="row"><strong>Pad 1 · Steps</strong><small>Variation A</small></div><div class="lane"><span>Trigger</span><div class="trigs"></div></div><div class="lane"><span>Notes</span><div class="cells"></div></div>
<div class="edit" hidden><div class="row"><strong id="target"></strong><button id="close">Close</button></div><div class="keyboard" aria-label="Chord voicing, C4 to B4"></div><div class="row"><small id="notes"></small><div class="actions"><button id="copy">Copy</button><button id="place">Place copy</button></div></div></div>
<details><summary>Expression</summary><div class="bars" aria-label="Four trigger velocities"></div></details></div></article></div>
</section>
<style>
#k-fit{--gold:#e8dcc4;--ink:#f7fafc;--soft:#b9b7b2;--line:#43413e;--face:#201f1d;--accent:#85b4ff;--k-fs-3:.7rem;--k-fs-5:.8rem;--k-fs-6:.9rem;--k-fw-medium:500;--k-fw-semi:600;background:linear-gradient(135deg,#100f0e,#1c1b19);color:var(--ink);font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;padding:16px;border-radius:8px}

#k-fit .panes{display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);max-width:1480px;gap:10px;margin:auto;align-items:start}#k-fit [data-workspace=Synth]{--accent:#e07a84;max-width:1200px}#k-fit article{background:var(--face);border:1px solid #454340;border-radius:8px;min-width:0}#k-fit .work{container-type:inline-size}#k-fit article>header{font-weight:700;padding:9px 12px 8px;border-bottom:1px solid var(--line);color:var(--accent)}#k-fit small{color:var(--soft);font-size:11.5px;font-weight:500}#k-fit .inside{padding:10px 12px 12px;display:grid;gap:12px}#k-fit .inside>#journey{justify-self:start}#k-fit .strip{padding:8px 12px;border-top:1px solid #383633}#k-fit .instrument{display:grid;grid-template-columns:212px 1fr;gap:16px;padding:12px;align-items:center}#k-fit .dial{position:relative;width:208px;height:208px;margin:auto}#k-fit .track,#k-fit .hub{border:1px solid #514d46;border-radius:100%;position:absolute;inset:16px}#k-fit .track{background:repeating-conic-gradient(from -1deg,#383633 0deg 1deg,transparent 1deg 6deg);mask:radial-gradient(circle,transparent 66%,#000 67%)}#k-fit .hub{inset:47px;background:radial-gradient(circle at 35% 28%,#37332e,#22211f);display:grid;align-content:center;justify-items:center;color:var(--gold)}#k-fit .hub b{font-size:20px}#k-fit .tone{position:absolute;transform:translate(-50%,-50%);min-width:23px;text-align:center;border-radius:9px;font-weight:600;background:var(--face);color:var(--soft)}#k-fit .tone.current{background:#afcbe9;color:#171615}#k-fit .tone.route{border-bottom:2px solid #829bb3}#k-fit .brain{display:grid;gap:8px;min-width:0}#k-fit .pads{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}#k-fit .pads button{padding:5px 2px;font-weight:600}#k-fit .pads small{display:block;font-size:11px}#k-fit #back{justify-self:start}#k-fit .lane{display:grid;grid-template-columns:56px 1fr;gap:8px;align-items:center}#k-fit .cells,#k-fit .trigs,#k-fit .bars{display:grid;grid-template-columns:repeat(4,minmax(0 @container(max-width:559px){#k-fit .instrument{grid-template-columns:1fr;gap:6px}#k-fit .brain{width:100%;max-width:380px;margin:auto}}
@media(max-width:900px){#k-fit .panes{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){#k-fit{padding:6px}#k-fit .lane{grid-template-columns:46px 1fr;gap:4px}}
@media(pointer:coarse){#k-fit button:not([class^=sl-slider]),#k-fit summary{min-height:44px;min-width:44px}}
</style>
