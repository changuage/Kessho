<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earth Scene – v7 Horizontal Levels</title>
<!--
  ╔══════════════════════════════════════════════════════════════════════╗
  ║  EARTH SCENE VISUALIZER — Standalone HTML mockup for the Kessho    ║
  ║  generative music app. This file prototypes the visual layer that  ║
  ║  will be ported to a React component (EarthSceneVis.tsx).          ║
  ║                                                                    ║
  ║  PORTING GUIDE:                                                    ║
  ║  • CSS        → CSS Modules or styled-components (see notes below) ║
  ║  • ZONES[]    → Derived from KesshoEngine SliderState per engine   ║
  ║  • visSvg()   → Per-zone React component returning <svg> JSX       ║
  ║  • DOM build  → JSX in EarthSceneVis.tsx                           ║
  ║  • Drag logic → usePointerDrag() custom hook                       ║
  ║  • updateVis  → useEffect watching [lv, rv, dn, it] per zone      ║
  ║  • Test panel → Remove entirely; params come from SliderState      ║
  ║                                                                    ║
  ║  PERFORMANCE NOTES:                                                ║
  ║  • All visual effects use GPU-compositor-only CSS (filter,         ║
  ║    transform, opacity) — zero layout/paint cost.                   ║
  ║  • CSS animations run on compositor thread; JS only updates        ║
  ║    animation-duration when density changes (not per-frame).        ║
  ║  • SVG elements are static markup; no per-frame JS rendering.     ║
  ╚══════════════════════════════════════════════════════════════════════╝
-->
<!--
  PORT: CSS below maps to React as follows:
  .card         → EarthSceneVis container (width from parent)
  .hdr          → <Header> sub-component or inline JSX
  .split        → flex row: <EnginePanel> + <VisPanel>
  .engines      → <EnginePanel>: list of <EngineRow> components
  .eng          → <EngineRow>: receives {zone, onToggle, isHighlighted}
  .vis-wrap     → <VisPanel>: overflow:hidden container, height from recalcHeight
  .vis-land     → flex-column of <ZoneStrip> components
  .vz           → <ZoneStrip>: receives {zone, refs, onDrag}
  .vz-svg       → <ZoneSvg>: renders visSvg() output as dangerouslySetInnerHTML
                  or better: per-zone React SVG components
  .vz-bar       → Level indicator bar (right edge) — inline style from z.lv
  .vz-rbar      → Reverb indicator bar (left edge) — inline style from z.rv
  .vz-info      → Hover overlay showing label + percentage

  ANIMATIONS:
  All @keyframes can be kept as global CSS or in the component's CSS module.
  animation-duration is dynamically updated via JS (density param) — in React,
  use a ref to the SVG container and update style.animationDuration in useEffect.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0e0e0e;color:#999;font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;padding:20px}

  .card{width:520px;background:#131313;border-radius:6px;border:1px solid #1c1c1c;overflow:hidden}
  .hdr{display:flex;align-items:baseline;justify-content:space-between;padding:10px 14px 9px;border-bottom:1px solid #1a1a1a}
  .hdr-t{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#555}
  .hdr-h{font-size:8px;font-weight:300;color:#333;letter-spacing:.04em}

  .split{display:flex;border-top:1px solid #1a1a1a}

  /* ── engine panel ── */
  .engines{width:120px;flex-shrink:0;border-right:1px solid #1a1a1a;padding:6px 0;overflow-y:auto;max-height:400px;scrollbar-width:none}
  .engines::-webkit-scrollbar{display:none}

  .eg-group{display:flex;align-items:center;padding:2px 8px;margin-top:4px}
  .eg-group:first-child{margin-top:0}
  .eg-lbl{font-size:5.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#2a2a2a}
  .eg-ln{flex:1;height:1px;background:#1a1a1a;margin-left:5px}

  .eng{display:flex;align-items:center;gap:5px;padding:3px 8px;cursor:pointer;transition:background .15s}
  .eng:hover{background:rgba(255,255,255,.02)}
  .eng.sub{padding-left:15px}
  .eng-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;transition:opacity .2s,box-shadow .25s}
  .eng-dot.on{opacity:.9}
  .eng-dot.off{opacity:.12}
  .eng-name{font-size:7px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;color:#444;white-space:nowrap;transition:color .2s}
  .eng:hover .eng-name{color:#666}
  .eng.disabled .eng-name{color:#222}
  .eng-pct{font-size:6.5px;font-weight:300;color:#2a2a2a;margin-left:auto;font-variant-numeric:tabular-nums;min-width:18px;text-align:right;transition:color .2s}
  .eng.disabled .eng-pct{color:#1a1a1a}

  .eng.highlight{background:rgba(255,255,255,.05)}
  .eng.highlight .eng-name{color:#999}
  .eng.highlight .eng-pct{color:#555}

  /* ── visualiser ── */
  .vis-wrap{flex:1;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;background:#090c0f}
  .vis-land{display:flex;flex-direction:column;position:absolute;left:0;top:0;right:0;bottom:0}

  /* ── zone ── */
  .vz{position:relative;overflow:hidden;transition:flex .5s cubic-bezier(.4,0,.2,1);min-height:0;cursor:ew-resize}
  .vz.gone{flex:0 0 0px !important;pointer-events:none}
  .vz.gone .vz-svg{opacity:0}
  .vz + .vz{border-top:1px solid rgba(255,255,255,.015)}
  .vz:hover{background:rgba(255,255,255,.006)}

  .vz-svg{position:absolute;left:0;top:0;right:0;bottom:0;transition:opacity .4s;pointer-events:none}
  .vz-svg svg{display:block;width:100%;height:100%}

  /* vertical level bar (right edge) */
  .vz-bar{position:absolute;right:0;top:0;bottom:0;width:3px;pointer-events:none}
  .vz-bar-f{position:absolute;bottom:0;left:0;width:100%;border-radius:.5px;transition:height .12s,opacity .25s}

  /* reverb bar (left edge) */
  .vz-rbar{position:absolute;left:0;top:0;bottom:0;width:3px;pointer-events:none}
  .vz-rbar-f{position:absolute;bottom:0;left:0;width:100%;border-radius:.5px;transition:height .12s,opacity .25s}

  /* drag axis indicator */
  .vz.drag-lv{cursor:ew-resize}
  .vz.drag-rv{cursor:ns-resize}

  /* ── info overlay (appears on hover/drag, inline in zone) ── */
  .vz-info{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:6px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:3}
  .vz:hover .vz-info{opacity:1}
  .vz.dragging .vz-info{opacity:1}
  .vz-info-lbl{font-size:7px;font-weight:400;letter-spacing:.05em;text-transform:uppercase;color:#3a3a3a}
  .vz-info-pct{font-size:8px;font-weight:300;color:#444;font-variant-numeric:tabular-nums}

  /*
   * PORT: Keyframe animations — keep as-is in CSS module.
   * These are pure CSS animations running on the compositor thread.
   * animation-duration is scaled at runtime by the density parameter
   * via updateVis() → el.style.animationDuration = base / speedMult.
   *
   * Naming convention:
   *   birdGlide   — slow horizontal drift of entire bird flock
   *   birdFade    — individual bird fade-in/out (staggered, ~2-3 visible)
   *   wingBeat    — per-bird scaleY flapping
   *   insectFade  — individual insect fade-in/out (staggered)
   *   chirp/chirp2— insect pulse flash
   *   frogFade    — individual frog source fade-in/out (staggered, ~2-3 visible)
   *   rippleOut   — expanding rings from frog positions
   *   dropFall    — downward teardrop fall (hard drops)
   *   splashRing  — expanding impact ring (water drops)
   *   bubbleUp    — rising hollow circles
   *   turbWave, channelFlow, surfScroll, waveScroll — horizontal scroll loops
   *   foam        — foam dot opacity pulse
   *   floatUp     — generic upward float + fadeout
   */
  @keyframes birdGlide{0%{transform:translate(0,0)}25%{transform:translate(8px,-3px)}50%{transform:translate(3px,1px)}75%{transform:translate(-5px,-2px)}100%{transform:translate(0,0)}}
  @keyframes wingBeat{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.55)}}
  @keyframes birdFade{0%,100%{opacity:0}25%,55%{opacity:1}}
  @keyframes frogFade{0%,100%{opacity:0}20%,55%{opacity:1}}
  @keyframes insectFade{0%,100%{opacity:0}15%,50%{opacity:1}}
  @keyframes chirp{0%,70%,100%{opacity:.25}75%{opacity:1}}
  @keyframes chirp2{0%,60%,100%{opacity:.22}65%{opacity:1}}
  @keyframes rippleOut{0%{r:3;opacity:.6}100%{r:20;opacity:0}}
  @keyframes splashRing{0%{r:1;opacity:.8}100%{r:12;opacity:0}}
  @keyframes dropFall{0%{transform:translateY(-12px);opacity:.8}70%{transform:translateY(18px);opacity:.5}100%{transform:translateY(24px);opacity:0}}
  @keyframes softRipple{0%{r:1;opacity:0}20%{opacity:.55}100%{r:10;opacity:0}}
  @keyframes bubbleUp{0%{transform:translateY(0);opacity:.65}100%{transform:translateY(-16px);opacity:0}}
  @keyframes turbWave{0%{transform:translateX(0)}100%{transform:translateX(-60px)}}
  @keyframes channelFlow{0%{transform:translateX(0)}100%{transform:translateX(-50px)}}
  @keyframes surfScroll{0%{transform:translateX(0)}100%{transform:translateX(-40px)}}
  @keyframes foam{0%,100%{opacity:.2}30%{opacity:.85}60%{opacity:.3}}
  @keyframes waveScroll{0%{transform:translateX(0)}100%{transform:translateX(-80px)}}
  @keyframes floatUp{0%{transform:translateY(0);opacity:.5}100%{transform:translateY(-12px);opacity:0}}

  /* ── TEST SLIDERS (temporary — remove for final integration) ── */
  .test-panel{width:520px;margin-top:12px;background:#131313;border-radius:6px;border:1px solid #1c1c1c;padding:12px 14px}
  .test-panel h3{font-size:8px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#333;margin-bottom:8px}
  .test-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .test-row label{font-size:7px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;color:#444;min-width:55px}
  .test-row input[type=range]{flex:1;height:3px;-webkit-appearance:none;appearance:none;background:#1a1a1a;border-radius:2px;outline:none}
  .test-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:8px;border-radius:50%;background:#555;cursor:pointer}
  .test-row .test-val{font-size:7px;color:#444;min-width:22px;text-align:right;font-variant-numeric:tabular-nums}
  .test-row select{font-size:7px;background:#1a1a1a;color:#555;border:1px solid #222;border-radius:3px;padding:2px 4px;outline:none}
</style>
</head>
<body>

<div class="card">
  <div class="hdr">
    <span class="hdr-t">Earth Scene</span>
    <span class="hdr-h">toggle · drag ↔ level · drag ↕ reverb</span>
  </div>
  <div class="split">
    <div class="engines" id="engines"></div>
    <div class="vis-wrap" id="visWrap">
      <div class="vis-land" id="visLand"></div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════════════
     TEST SLIDERS — temporary UI for testing animation responses.
     In final integration these values come from the audio engine:
       • density  → SliderState density param per engine
       • intensity → SliderState intensity param per engine
       • reverb   → SliderState reverbSend per engine (already wired via drag)
       • level    → SliderState level per engine (already wired via drag)
     Remove this panel when integrating into React.
     ══════════════════════════════════════════════════════════════════ -->
<div class="test-panel" id="testPanel">
  <h3>Test Parameters (temporary)</h3>
  <div class="test-row">
    <label>Zone</label>
    <select id="testZone"></select>
  </div>
  <div class="test-row">
    <label>Density</label>
    <input type="range" id="testDensity" min="0" max="100" value="50">
    <span class="test-val" id="testDensityVal">50%</span>
  </div>
  <div class="test-row">
    <label>Intensity</label>
    <input type="range" id="testIntensity" min="0" max="100" value="50">
    <span class="test-val" id="testIntensityVal">50%</span>
  </div>
  <div class="test-row">
    <label>Reverb</label>
    <input type="range" id="testReverb" min="0" max="100" value="20">
    <span class="test-val" id="testReverbVal">20%</span>
  </div>
  <div class="test-row">
    <label>Level</label>
    <input type="range" id="testLevel" min="0" max="100" value="70">
    <span class="test-val" id="testLevelVal">70%</span>
  </div>
</div>

<script>
/*
 * ══════════════════════════════════════════════════════════════════
 * DATA MODEL
 * ══════════════════════════════════════════════════════════════════
 * PORT: In React, ZONES is not a static array — each zone's values
 * come from the corresponding KesshoEngine's SliderState:
 *   const { level, reverbSend, density, intensity } = useSliderState(engineId);
 *
 * The on/off toggle maps to engine.enabled in the audio graph.
 * The 'w' (flex weight) and 'accent' are static config per engine.
 * The 'group' determines which section header to render.
 *
 * Property → SliderState mapping:
 *   lv  → SliderState.level       (0-1) master volume → vis opacity
 *   rv  → SliderState.reverbSend  (0-1) reverb wet → vis blur + spread
 *   dn  → SliderState.density     (0-1) event rate → animation speed
 *   it  → SliderState.intensity   (0-1) amplitude → brightness + scale
 *   on  → engine.enabled          (bool) toggle audio + visibility
 * ══════════════════════════════════════════════════════════════════
 */
const ZONES = [
  // INTEGRATION NOTE: In the final React component, density/intensity values
  // come from SliderState per engine. These defaults are for mockup testing only.
  // density  (0-1): controls animation speed — more dense = faster cycling of events
  // intensity(0-1): controls brightness + scale — more intense = brighter, slightly larger
  // rv       (0-1): reverb send — controls blur + spread (spatial diffusion)
  // lv       (0-1): level — controls master opacity of the SVG layer
  { id:'birds1',     label:'Birds Alps',   accent:'#6a9a6a', w:3, on:true,  lv:.70, rv:.20, dn:.50, it:.50, group:'nature' },
  { id:'birds2',     label:'Birds Fujian', accent:'#6898aa', w:2, on:true,  lv:.50, rv:.35, dn:.50, it:.50, group:'nature' },
  { id:'insects1',   label:'Insects 1',    accent:'#88b868', w:2, on:true,  lv:.60, rv:.10, dn:.50, it:.50, group:'nature' },
  { id:'insects2',   label:'Insects 2',    accent:'#b8a050', w:2, on:false, lv:.40, rv:.00, dn:.50, it:.50, group:'nature' },
  { id:'frogs',      label:'Frogs',        accent:'#4a7a5a', w:2, on:true,  lv:.55, rv:.40, dn:.50, it:.50, group:'nature' },
  { id:'hardDrops',  label:'Hard Drops',   accent:'#5a8aaa', w:2, on:true,  lv:.35, rv:.25, dn:.50, it:.50, group:'water' },
  { id:'waterDrops', label:'Water Drops',  accent:'#4a80a0', w:2, on:true,  lv:.70, rv:.15, dn:.50, it:.50, group:'water' },
  { id:'bubbling',   label:'Bubbling',     accent:'#4090a0', w:2, on:true,  lv:.92, rv:.50, dn:.50, it:.50, group:'water' },
  { id:'turbulence', label:'Turbulence',   accent:'#3a7090', w:2, on:true,  lv:.56, rv:.30, dn:.50, it:.50, group:'water' },
  { id:'channels',   label:'Channels',     accent:'#306888', w:2, on:false, lv:.00, rv:.00, dn:.50, it:.50, group:'water' },
  { id:'surf',       label:'Surf',         accent:'#2a6080', w:2, on:false, lv:.00, rv:.00, dn:.50, it:.50, group:'water' },
  { id:'waves',      label:'Waves',        accent:'#1e3a52', w:3, on:true,  lv:.80, rv:.45, dn:.50, it:.50, group:'ocean' },
];

const engEl  = document.getElementById('engines');
const landEl = document.getElementById('visLand');
const wrapEl = document.getElementById('visWrap');

/*
 * ══════════════════════════════════════════════════════════════════
 * SVG GENERATORS
 * ══════════════════════════════════════════════════════════════════
 * PORT: Each case becomes a React component, e.g.:
 *   <BirdsAlpsSvg accent={zone.accent} />
 *
 * The SVG markup is static — it never changes after mount.
 * Only the container's CSS properties (opacity, filter, transform,
 * animation-duration) are updated reactively.
 *
 * Animation architecture per zone:
 *   birds1/2  — birdGlide (flock drift) > birdFade (per-bird stagger)
 *               > wingBeat (per-bird flap). 8-9 birds, ~2-3 visible.
 *   insects1  — insectFade (per-dot stagger) > chirp (pulse flash).
 *   insects2  — insectFade > chirp2 (with antenna lines).
 *   frogs     — frogFade (per-source stagger) > rippleOut (expanding rings).
 *               6 sources, ~2-3 visible at a time.
 *   hardDrops — 8 teardrops falling via dropFall, no ripple.
 *   waterDrops— static dots + splashRing expanding circles.
 *   bubbling  — hollow circles rising via bubbleUp.
 *   turbulence— two wavy paths scrolling via turbWave.
 *   channels  — three stream paths scrolling via channelFlow.
 *   surf      — choppy crests scrolling + foam dots pulsing.
 *   waves     — three deep swell curves scrolling via waveScroll.
 * ══════════════════════════════════════════════════════════════════
 */
function visSvg(z) {
  const c = z.accent;
  switch (z.id) {
    case 'birds1': return `<svg viewBox="0 0 500 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <g style="animation:birdGlide 20s ease-in-out infinite">
        <g transform="translate(40,18)" style="animation:birdFade 8s ease infinite 0s"><path d="M-8,4 L0,-4 L8,4" stroke="${c}" stroke-width="2.5" fill="none" stroke-linecap="round" style="animation:wingBeat 2.3s ease infinite;transform-origin:0 0"/></g>
        <g transform="translate(110,42)" style="animation:birdFade 9.3s ease infinite 2.7s"><path d="M-7,3 L0,-4 L7,3" stroke="${c}" stroke-width="2.2" fill="none" stroke-linecap="round" style="animation:wingBeat 2.5s ease infinite .3s;transform-origin:0 0"/></g>
        <g transform="translate(180,12)" style="animation:birdFade 7.3s ease infinite 5.3s"><path d="M-9,4 L0,-5 L9,4" stroke="${c}" stroke-width="2.5" fill="none" stroke-linecap="round" style="animation:wingBeat 2.8s ease infinite .8s;transform-origin:0 0"/></g>
        <g transform="translate(240,50)" style="animation:birdFade 8.7s ease infinite 1.3s"><path d="M-7,3 L0,-4 L7,3" stroke="${c}" stroke-width="2.2" fill="none" stroke-linecap="round" style="animation:wingBeat 2.1s ease infinite 2s;transform-origin:0 0"/></g>
        <g transform="translate(310,22)" style="animation:birdFade 10s ease infinite 6.7s"><path d="M-8,4 L0,-4 L8,4" stroke="${c}" stroke-width="2.3" fill="none" stroke-linecap="round" style="animation:wingBeat 2.7s ease infinite 1.3s;transform-origin:0 0"/></g>
        <g transform="translate(370,38)" style="animation:birdFade 8s ease infinite 4s"><path d="M-7,3 L0,-4 L7,3" stroke="${c}" stroke-width="2.2" fill="none" stroke-linecap="round" style="animation:wingBeat 2.4s ease infinite .5s;transform-origin:0 0"/></g>
        <g transform="translate(430,14)" style="animation:birdFade 9.3s ease infinite 8s"><path d="M-8,4 L0,-4 L8,4" stroke="${c}" stroke-width="2.5" fill="none" stroke-linecap="round" style="animation:wingBeat 3s ease infinite .5s;transform-origin:0 0"/></g>
        <g transform="translate(480,46)" style="animation:birdFade 8.7s ease infinite 4.7s"><path d="M-7,3 L0,-3 L7,3" stroke="${c}" stroke-width="2" fill="none" stroke-linecap="round" style="animation:wingBeat 2.3s ease infinite 1.1s;transform-origin:0 0"/></g>
      </g></svg>`;
    case 'birds2': return `<svg viewBox="0 0 500 50" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <g style="animation:birdGlide 15s ease-in-out infinite reverse">
        <g transform="translate(30,14)" style="animation:birdFade 7.3s ease infinite 0s"><path d="M-6,3 L0,-3 L6,3" stroke="${c}" stroke-width="2.2" fill="none" stroke-linecap="round" style="animation:wingBeat 1.7s ease infinite .1s;transform-origin:0 0"/></g>
        <g transform="translate(95,36)" style="animation:birdFade 8.7s ease infinite 2.3s"><path d="M-5,3 L0,-3 L5,3" stroke="${c}" stroke-width="1.8" fill="none" stroke-linecap="round" style="animation:wingBeat 1.9s ease infinite .9s;transform-origin:0 0"/></g>
        <g transform="translate(150,10)" style="animation:birdFade 8s ease infinite 4.7s"><path d="M-6,3 L0,-3 L6,3" stroke="${c}" stroke-width="2.2" fill="none" stroke-linecap="round" style="animation:wingBeat 1.5s ease infinite 1.9s;transform-origin:0 0"/></g>
        <g transform="translate(215,40)" style="animation:birdFade 9.3s ease infinite 1s"><path d="M-5,3 L0,-3 L5,3" stroke="${c}" stroke-width="1.8" fill="none" stroke-linecap="round" style="animation:wingBeat 2s ease infinite 1.3s;transform-origin:0 0"/></g>
        <g transform="translate(280,18)" style="animation:birdFade 8s ease infinite 6s"><path d="M-6,3 L0,-3 L6,3" stroke="${c}" stroke-width="2.2" fill="none" stroke-linecap="round" style="animation:wingBeat 1.7s ease infinite .5s;transform-origin:0 0"/></g>
        <g transform="translate(340,32)" style="animation:birdFade 7.3s ease infinite 3.3s"><path d="M-5,3 L0,-3 L5,3" stroke="${c}" stroke-width="1.8" fill="none" stroke-linecap="round" style="animation:wingBeat 1.6s ease infinite 2.3s;transform-origin:0 0"/></g>
        <g transform="translate(400,12)" style="animation:birdFade 8.7s ease infinite 7.3s"><path d="M-6,3 L0,-3 L6,3" stroke="${c}" stroke-width="2" fill="none" stroke-linecap="round" style="animation:wingBeat 1.8s ease infinite 1s;transform-origin:0 0"/></g>
        <g transform="translate(450,38)" style="animation:birdFade 8s ease infinite 1.7s"><path d="M-5,3 L0,-3 L5,3" stroke="${c}" stroke-width="1.8" fill="none" stroke-linecap="round" style="animation:wingBeat 1.5s ease infinite 2.7s;transform-origin:0 0"/></g>
        <g transform="translate(485,24)" style="animation:birdFade 9.3s ease infinite 4.3s"><path d="M-5,3 L0,-3 L5,3" stroke="${c}" stroke-width="1.8" fill="none" stroke-linecap="round" style="animation:wingBeat 1.9s ease infinite .4s;transform-origin:0 0"/></g>
      </g></svg>`;
    case 'insects1': return `<svg viewBox="0 0 500 40" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">

/*
 * ══════════════════════════════════════════════════════════════════
 * DOM CONSTRUCTION
 * ══════════════════════════════════════════════════════════════════
 * PORT: Replace with JSX. The refs{} object maps to React useRef
 * per zone. Structure:
 *   refs[zoneId] = {
 *     row     — engine list row element (for highlight class toggle)
 *     dot     — status dot (color + glow)
 *     pct     — percentage text display
 *     vel     — zone strip container (drag target)
 *     vsvg    — SVG wrapper div (opacity, filter, transform applied here)
 *     barF    — level bar fill element
 *     rbarF   — reverb bar fill element
 *     infoPct — info overlay percentage text
 *     infoLbl — info overlay label text
 *   }
 *
 * In React, most of these become controlled via props/state rather
 * than direct DOM manipulation. The highlight class toggle should
 * use a useState<string|null>(hoveredZoneId) pattern.
 * ══════════════════════════════════════════════════════════════════
 */
const refs = {};
let lastGroup = null;

ZONES.forEach(z => {
  // group headers
  if (z.group !== lastGroup) {
    lastGroup = z.group;
    const gh = document.createElement('div');
    gh.className = 'eg-group';
    const gl = document.createElement('span');
    gl.className = 'eg-lbl';
    gl.textContent = z.group === 'water' ? 'Water Engine' : z.group === 'ocean' ? 'Samples' : 'Nature';
    const gln = document.createElement('div');
    gln.className = 'eg-ln';
    gh.append(gl, gln);
    engEl.appendChild(gh);
  }

  // ── engine toggle ──
  const row = document.createElement('div');
  row.className = 'eng' + (z.on ? '' : ' disabled');

  const dot = document.createElement('div');
  dot.className = 'eng-dot ' + (z.on ? 'on' : 'off');
  dot.style.background = z.accent;
  dot.style.boxShadow = z.on ? `0 0 4px ${z.accent}40` : 'none';

  const name = document.createElement('span');
  name.className = 'eng-name';
  name.textContent = z.label;

  const pct = document.createElement('span');
  pct.className = 'eng-pct';
  pct.textContent = z.on ? Math.round(z.lv * 100) + '%' : '—';

  row.append(dot, name, pct);
  row.addEventListener('click', () => {
    z.on = !z.on;
    syncToggle(z);
    syncZone(z);
    recalcHeight();
  });
  engEl.appendChild(row);

  // ── vis zone ──
  const vel = document.createElement('div');
  vel.className = 'vz' + (z.on ? '' : ' gone');
  vel.style.flex = z.on ? z.w : '0';
  vel.style.background = `linear-gradient(180deg, ${z.accent}05 0%, ${z.accent}02 100%)`;

  const vsvg = document.createElement('div');
  vsvg.className = 'vz-svg';
  vsvg.innerHTML = visSvg(z);

  // vertical level bar (right edge)
  const bar = document.createElement('div');
  bar.className = 'vz-bar';
  const barF = document.createElement('div');
  barF.className = 'vz-bar-f';
  barF.style.background = z.accent;
  bar.appendChild(barF);

  // reverb bar (left edge)
  const rbar = document.createElement('div');
  rbar.className = 'vz-rbar';
  const rbarF = document.createElement('div');
  rbarF.className = 'vz-rbar-f';
  // lighter/cooler tint of accent for reverb
  rbarF.style.background = z.accent.replace(/[0-9a-f]{2}$/i, '') + 'cc';
  rbarF.style.opacity = '.15';
  rbar.appendChild(rbarF);

  // hover info
  const info = document.createElement('div');
  info.className = 'vz-info';
  const infoLbl = document.createElement('span');
  infoLbl.className = 'vz-info-lbl';
  infoLbl.textContent = z.label;
  const infoPct = document.createElement('span');
  infoPct.className = 'vz-info-pct';
  info.append(infoLbl, infoPct);

  vel.append(vsvg, bar, rbar, info);

  // axis-lock drag
  vel.addEventListener('pointerdown', e => startDrag(e, z, vel));
  vel.addEventListener('mouseenter', () => refs[z.id].row.classList.add('highlight'));
  vel.addEventListener('mouseleave', () => { if (!drag || drag.z.id !== z.id) refs[z.id].row.classList.remove('highlight'); });
  landEl.appendChild(vel);

  refs[z.id] = { row, dot, pct, vel, vsvg, barF, rbarF, infoPct, infoLbl };
});

/*
 * ══════════════════════════════════════════════════════════════════
 * STATE UPDATE FUNCTIONS
 * ══════════════════════════════════════════════════════════════════
 * PORT: These become React effects or callbacks:
 *   syncToggle → inline in JSX (className derived from zone.on)
 *   syncZone   → useEffect watching zone.on
 *   updateLevel → useEffect watching zone.lv
 *   updateReverb → useEffect watching zone.rv
 *   updateVis  → useEffect watching [zone.lv, zone.rv, zone.dn, zone.it]
 *   showInfo   → setState for info overlay content
 *   recalcHeight → useMemo computing height from active zone weights
 * ══════════════════════════════════════════════════════════════════
 */
function syncToggle(z) {
  const r = refs[z.id];
  r.row.className = 'eng' + (z.on ? '' : ' disabled');
  r.dot.className = 'eng-dot ' + (z.on ? 'on' : 'off');
  r.dot.style.boxShadow = z.on ? `0 0 4px ${z.accent}40` : 'none';
  r.pct.textContent = z.on ? Math.round(z.lv * 100) + '%' : '—';
}

function syncZone(z) {
  const r = refs[z.id];
  r.vel.className = 'vz' + (z.on ? '' : ' gone');
  r.vel.style.flex = z.on ? z.w : '0';
  updateLevel(z);
  updateReverb(z);
  updateVis(z);
}

function updateLevel(z) {
  const r = refs[z.id];
  r.barF.style.height = (z.lv * 100) + '%';
  r.barF.style.opacity = z.on ? (.3 + z.lv * .5) : '.03';
  r.pct.textContent = z.on ? Math.round(z.lv * 100) + '%' : '—';
}

function updateReverb(z) {
  const r = refs[z.id];
  r.rbarF.style.height = (z.rv * 100) + '%';
  r.rbarF.style.opacity = z.on ? (.15 + z.rv * .5) : '.03';
}

function updateVis(z) {
  const r = refs[z.id];
  if (!z.on) return;

  // ── LEVEL → master opacity ──
  // INTEGRATION: wired to SliderState.level per engine
  // Higher level = more visible animation
  r.vsvg.style.opacity = (.1 + z.lv * .9);

  // ── REVERB → blur + spatial spread (GPU-only, cheap) ──
  // INTEGRATION: wired to SliderState.reverbSend per engine
  // More reverb = more diffuse/blurred shapes, slight size expansion
  const blurPx = z.rv * 1.2;
  const reverbScale = 1 + z.rv * 0.06;

  // ── INTENSITY → brightness + scale boost ──
  // INTEGRATION: wired to SliderState.intensity per engine
  // More intensity = brighter glow, slightly larger presence
  // Combines multiplicatively with reverb scale
  const brightMult = 1 + z.it * 0.5;
  const intensityScale = 1 + z.it * 0.12;

  // ── DENSITY → animation speed (via CSS custom property) ──
  // INTEGRATION: wired to SliderState.density per engine
  // More density = faster animation cycling (more events per second)
  // Speed multiplier: 0.4× at dn=0 (very slow) → 2× at dn=1 (very fast)
  const speedMult = 0.4 + z.dn * 1.6;
  r.vel.style.setProperty('--speed', speedMult);

  // ── DENSITY → saturation (subtle color richness) ──
  // INTEGRATION: higher density = richer/more saturated color
  const saturation = 0.6 + z.dn * 0.8;

  // Compose all GPU filters into a single string (one compositor pass)
  r.vsvg.style.filter = [
    `blur(${blurPx}px)`,
    `brightness(${brightMult})`,
    `saturate(${saturation})`
  ].join(' ');

  // Compose scale: reverb spread × intensity size
  r.vsvg.style.transform = `scale(${reverbScale * intensityScale})`;

  // Apply speed to all animated elements inside this zone's SVG
  // Uses CSS calc() with the custom property for smooth updates
  const svgEl = r.vsvg.querySelector('svg');
  if (svgEl) {
    svgEl.querySelectorAll('[style*="animation"]').forEach(el => {
      const cur = el.style.animationDuration;
      if (!el.dataset.baseDur) el.dataset.baseDur = cur || '3s';
      const base = parseFloat(el.dataset.baseDur);
      el.style.animationDuration = (base / speedMult) + 's';
    });
  }
}

function showInfo(z, axis) {
  const r = refs[z.id];
  if (axis === 'rv') {
    r.infoLbl.textContent = 'RV';
    r.infoPct.textContent = Math.round(z.rv * 100) + '%';
  } else {
    r.infoLbl.textContent = z.label;
    r.infoPct.textContent = Math.round(z.lv * 100) + '%';
  }
}

function recalcHeight() {
  const active = ZONES.filter(z => z.on);
  const totalW = active.reduce((s, z) => s + z.w, 0);
  wrapEl.style.height = Math.max(160, Math.min(400, totalW * 22)) + 'px';
}

/*
 * ══════════════════════════════════════════════════════════════════
 * AXIS-LOCK DRAG SYSTEM
 * ══════════════════════════════════════════════════════════════════
 * PORT: Extract to usePointerDrag(zoneRef, { onLevel, onReverb }) hook.
 *
 * Behavior:
 *   1. pointerdown → record start position, enter "dead zone" state
 *   2. First move beyond DEAD_ZONE (5px) → lock to dominant axis:
 *      - horizontal (dx > dy) → level mode (cursor: ew-resize)
 *      - vertical   (dy > dx) → reverb mode (cursor: ns-resize)
 *   3. Subsequent moves update only the locked parameter:
 *      - level:  x position → lv (0-1), snapped to 5% increments
 *      - reverb: inverted y → rv (0-1), snapped to 5% increments
 *   4. pointerup → cleanup, reset cursor, de-highlight engine row
 *
 * The info overlay updates during drag to show the active param.
 * The engine list row highlights during drag for visual feedback.
 *
 * In React, the hook should:
 *   - Accept a ref to the drag target element
 *   - Return { isDragging, axis } for conditional styling
 *   - Call onLevel(value) or onReverb(value) which dispatch to state
 * ══════════════════════════════════════════════════════════════════
 */
const DEAD_ZONE = 5; // px before axis lock
let drag = null;

function startDrag(e, z, el) {
  e.preventDefault();
  drag = { z, el, startX: e.clientX, startY: e.clientY, axis: null };
  refs[z.id].row.classList.add('highlight');
  el.classList.add('dragging');
  showInfo(z, 'lv');
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}

function onMove(e) {
  if (!drag) return;
  const d = drag;

  // lock axis on first significant movement
  if (!d.axis) {
    const dx = Math.abs(e.clientX - d.startX);
    const dy = Math.abs(e.clientY - d.startY);
    if (Math.max(dx, dy) < DEAD_ZONE) return; // still in dead zone
    d.axis = dx >= dy ? 'lv' : 'rv';
    d.el.classList.toggle('drag-lv', d.axis === 'lv');
    d.el.classList.toggle('drag-rv', d.axis === 'rv');
  }

  applyDrag(e);
}

function onUp() {
  if (drag) {
    const r = refs[drag.z.id];
    r.row.classList.remove('highlight');
    drag.el.classList.remove('dragging', 'drag-lv', 'drag-rv');
    showInfo(drag.z, 'lv'); // reset to level display
  }
  drag = null;
  window.removeEventListener('pointermove', onMove);
  window.removeEventListener('pointerup', onUp);
}

function applyDrag(e) {
  const d = drag;
  const rect = d.el.getBoundingClientRect();

  if (d.axis === 'lv') {
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    d.z.lv = Math.round(pct * 20) / 20;
    updateLevel(d.z);
    updateVis(d.z);
    showInfo(d.z, 'lv');
  } else if (d.axis === 'rv') {
    // invert Y: drag up = more reverb
    const pct = Math.max(0, Math.min(1, 1 - (e.clientY - rect.top) / rect.height));
    d.z.rv = Math.round(pct * 20) / 20;
    updateReverb(d.z);
    updateVis(d.z);
    showInfo(d.z, 'rv');
  }
}

/*
 * ══════════════════════════════════════════════════════════════════
 * INITIALIZATION
 * PORT: In React, this is the initial render + useEffect([], ...).
 * Each zone's visual state is set on mount from SliderState values.
 * ══════════════════════════════════════════════════════════════════
 */
// init
ZONES.forEach(z => { updateLevel(z); updateReverb(z); updateVis(z); });
recalcHeight();

// ══════════════════════════════════════════════════════════════════
// TEST SLIDER WIRING — temporary, remove for final React integration
// In production, these values come from the audio engine's SliderState.
// ══════════════════════════════════════════════════════════════════
const testZoneSel = document.getElementById('testZone');
const testDensity = document.getElementById('testDensity');
const testIntensity = document.getElementById('testIntensity');
const testReverb = document.getElementById('testReverb');
const testLevel = document.getElementById('testLevel');
const testDensityVal = document.getElementById('testDensityVal');
const testIntensityVal = document.getElementById('testIntensityVal');
const testReverbVal = document.getElementById('testReverbVal');
const testLevelVal = document.getElementById('testLevelVal');

// populate zone selector with enabled zones
ZONES.filter(z => z.on).forEach(z => {
  const opt = document.createElement('option');
  opt.value = z.id;
  opt.textContent = z.label;
  testZoneSel.appendChild(opt);
});

function getSelectedZone() {
  return ZONES.find(z => z.id === testZoneSel.value);
}

function syncTestSliders() {
  const z = getSelectedZone();
  if (!z) return;
  testDensity.value = Math.round(z.dn * 100);
  testIntensity.value = Math.round(z.it * 100);
  testReverb.value = Math.round(z.rv * 100);
  testLevel.value = Math.round(z.lv * 100);
  testDensityVal.textContent = Math.round(z.dn * 100) + '%';
  testIntensityVal.textContent = Math.round(z.it * 100) + '%';
  testReverbVal.textContent = Math.round(z.rv * 100) + '%';
  testLevelVal.textContent = Math.round(z.lv * 100) + '%';
}

testZoneSel.addEventListener('change', syncTestSliders);

testDensity.addEventListener('input', () => {
  const z = getSelectedZone();
  z.dn = testDensity.value / 100;
  testDensityVal.textContent = testDensity.value + '%';
  updateVis(z);
});

testIntensity.addEventListener('input', () => {
  const z = getSelectedZone();
  z.it = testIntensity.value / 100;
  testIntensityVal.textContent = testIntensity.value + '%';
  updateVis(z);
});

testReverb.addEventListener('input', () => {
  const z = getSelectedZone();
  z.rv = testReverb.value / 100;
  testReverbVal.textContent = testReverb.value + '%';
  updateReverb(z);
  updateVis(z);
});

testLevel.addEventListener('input', () => {
  const z = getSelectedZone();
  z.lv = testLevel.value / 100;
  testLevelVal.textContent = testLevel.value + '%';
  updateLevel(z);
  updateVis(z);
});

syncTestSliders();
</script>
</body>
</html>
